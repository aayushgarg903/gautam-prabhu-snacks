<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="emeraldGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#094E34" />
      <stop offset="60%" stop-color="#073D29" />
      <stop offset="100%" stop-color="#042217" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DE88" />
      <stop offset="50%" stop-color="#C99A32" />
      <stop offset="100%" stop-color="#9A701A" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Antique Gold -->
  <circle cx="64" cy="64" r="62" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3" />

  <!-- Lotus Motif Top -->
  <path d="M64 16 C62 21, 57 24, 53 25 C58 26, 62 29, 64 33 C66 29, 70 26, 75 25 C71 24, 66 21, 64 16 Z" fill="url(#goldGrad)" />

  <!-- Central GP Monogram -->
  <text x="64" y="78" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-weight="700" font-size="44" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">GP</text>
  
  <!-- Lotus Motif Bottom -->
  <path d="M64 112 C62 107, 57 104, 53 103 C58 102, 62 99, 64 95 C66 99, 70 102, 75 103 C71 104, 66 107, 64 112 Z" fill="url(#goldGrad)" />
</svg>