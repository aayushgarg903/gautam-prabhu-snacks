<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <radialGradient id="emeraldRadial" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0A5337" />
      <stop offset="45%" stop-color="#073D29" />
      <stop offset="85%" stop-color="#052B20" />
      <stop offset="100%" stop-color="#031E15" />
    </radialGradient>

    <radialGradient id="maroonRadial" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8F1525" />
      <stop offset="60%" stop-color="#790F1C" />
      <stop offset="100%" stop-color="#550A13" />
    </radialGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9" />
      <stop offset="25%" stop-color="#E5C56A" />
      <stop offset="50%" stop-color="#C99A32" />
      <stop offset="75%" stop-color="#E5C56A" />
      <stop offset="100%" stop-color="#9A701A" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circular Text Paths -->
    <!-- Top Arc for GAUTAM PRABHHU SNACKS -->
    <path id="topTextArc" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
    <!-- Bottom Arc for SWEETS & NAMKEEN -->
    <path id="bottomTextArc" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
  </defs>

  <!-- Outer Scalloped / Beaded Rim -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#goldMetallic)" stroke-width="3" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-dasharray="3, 4" />

  <!-- Main Emerald Background -->
  <circle cx="250" cy="250" r="230" fill="url(#emeraldRadial)" stroke="url(#goldMetallic)" stroke-width="4" />

  <!-- Concentric Maroon Ring with Gold Border -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="130" fill="url(#maroonRadial)" stroke="url(#goldMetallic)" stroke-width="3" />
  <circle cx="250" cy="250" r="122" fill="none" stroke="url(#goldMetallic)" stroke-width="1" stroke-dasharray="2, 3" />

  <!-- Ornamental Botanical Flourishes on Ring -->
  <g fill="url(#goldMetallic)">
    <!-- 8 decorative star rosettes -->
    <g transform="translate(250, 48)"><polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" /></g>
    <g transform="translate(250, 452)"><polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" /></g>
    <g transform="translate(48, 250)"><polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" /></g>
    <g transform="translate(452, 250)"><polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" /></g>
  </g>

  <!-- Circular Brand Typography in Outer Ring -->
  <text fill="url(#goldMetallic)" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="28" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      GAUTAM PRABHHU SNACKS
    </textPath>
  </text>

  <text fill="url(#goldMetallic)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" letter-spacing="5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      • ROHTAK • HARYANA •
    </textPath>
  </text>

  <!-- Central Lotus & GP Monogram Section -->
  <!-- Top Lotus Motif in Maroon Medallion -->
  <g transform="translate(250, 155) scale(0.7)" fill="url(#goldMetallic)">
    <!-- Center petal -->
    <path d="M 0,-28 C -10,-10 -6,10 0,22 C 6,10 10,-10 0,-28 Z" />
    <!-- Inner left petal -->
    <path d="M 0,22 C -15,10 -22,-6 -14,-20 C -7,-6 -2,12 0,22 Z" />
    <!-- Inner right petal -->
    <path d="M 0,22 C 15,10 22,-6 14,-20 C 7,-6 2,12 0,22 Z" />
    <!-- Outer left petal -->
    <path d="M 0,22 C -24,14 -34,-2 -26,-12 C -18,-2 -6,14 0,22 Z" />
    <!-- Outer right petal -->
    <path d="M 0,22 C 24,14 34,-2 26,-12 C 18,-2 6,14 0,22 Z" />
    <!-- Base pod -->
    <circle cx="0" cy="24" r="3" />
  </g>

  <!-- GP Central Monogram -->
  <text x="250" y="278" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="92" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="-3">
    GP
  </text>

  <!-- Subtitle underneath GP -->
  <text x="250" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11.5" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="3.5">
    TRADITION IN EVERY BITE
  </text>

  <!-- Bottom Lotus Motif in Maroon Medallion (inverted) -->
  <g transform="translate(250, 345) scale(0.6) rotate(180)" fill="url(#goldMetallic)">
    <path d="M 0,-28 C -10,-10 -6,10 0,22 C 6,10 10,-10 0,-28 Z" />
    <path d="M 0,22 C -15,10 -22,-6 -14,-20 C -7,-6 -2,12 0,22 Z" />
    <path d="M 0,22 C 15,10 22,-6 14,-20 C 7,-6 2,12 0,22 Z" />
    <circle cx="0" cy="24" r="3" />
  </g>
</svg>
